<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/logo.png" />
    <title>404</title>

    <!-- =========================================
       GOOGLE FONT
       ========================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================
       LUCIDE ICONS
       ========================================= -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- =========================================
       CSS
       ========================================= -->

    <link rel="stylesheet" href="404.css" />
  </head>

  <body>
    <!-- =========================================
       PAGE CONTROLS
       ========================================= -->

    <div class="error-controls">
      <button
        class="error-control-btn"
        id="rtlToggle"
        type="button"
        aria-label="Toggle RTL"
        title="Toggle RTL"
      >
        <i data-lucide="arrow-left-right"></i>
      </button>

      <button
        class="error-control-btn"
        id="darkToggle"
        type="button"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
      >
        <i data-lucide="moon"></i>
      </button>
    </div>

    <!-- =========================================
       404 PAGE
       ========================================= -->

    <main class="error-page">
      <!-- =======================================
         MAIN BOX
         ======================================= -->

      <div class="error-card">
        <!-- =====================================
           LOGO
           ===================================== -->

        <div class="error-logo">
          <a href="index.html">
            <img
              src="images/logo.png"
              alt="AquaCare Aquarium Setup & Maintenance"
            />
          </a>
          <div class="logo-text" onclick="window.location.href = 'index.html'">
            <h1>
              <span class="aqua">Aqua</span><span class="care">Care</span>
            </h1>

            <p>Aquarium Setup &amp; Maintenance</p>
          </div>
        </div>

        <!-- =====================================
           AQUATIC ACCENT
           ===================================== -->

        <div class="water-accent">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <!-- =====================================
           404 NUMBER
           ===================================== -->

        <div class="error-number">
          <span>4</span>

          <div class="error-zero">
            <div class="zero-inner">
              <div class="water-line"></div>

              <div class="water-line water-line-two"></div>
            </div>
          </div>

          <span>4</span>
        </div>

        <!-- =====================================
           MESSAGE
           ===================================== -->

        <div class="error-content">
          <span class="error-label"> AQUA</span> <span class="error-label-2">CARE</span>

          <h1>Page <span>Not Found</span></h1>

          <p>
            The page you're looking for doesn't exist or may have been moved.
          </p>
        </div>

        <!-- =====================================
           BACK HOME
           ===================================== -->

        <a href="index.html" class="home-button">
          <i data-lucide="house"></i>

          <span>Back to Home</span>

          <i data-lucide="arrow-right" class="button-arrow"></i>
        </a>

        <!-- =====================================
           FOOT TEXT
           ===================================== -->

        <div class="error-footer">
          <span></span>

          <p>AQUARIUM SETUP &amp; MAINTENANCE</p>

          <span></span>
        </div>
      </div>
    </main>

    <!-- =========================================
       GLOBAL JS
       ========================================= -->

    <script src="global.js"></script>

    <!-- =========================================
       404 JS
       ========================================= -->

    <script src="404.js"></script>
  </body>
</html>
